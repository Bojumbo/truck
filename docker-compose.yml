version: '3.8'

services:
  app:
    build: .
    container_name: truck_driver_app
    restart: always
    ports:
      - "3000:7777"
    environment:
      - DATABASE_URL=mysql://truck_user:truck_password@db:3306/truck_db
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: truck_driver_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: truck_db
      MYSQL_USER: truck_user
      MYSQL_PASSWORD: truck_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
